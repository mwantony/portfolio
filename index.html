<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfólio de Antony Maziero Warken — Desenvolvedor Full-Stack especializado em React, Node.js, Laravel e Angular." />
    <meta name="keywords" content="desenvolvedor full-stack, react, node.js, laravel, angular, supabase, portfolio" />
    <meta name="author" content="Antony Maziero Warken" />
    <!-- Open Graph -->
    <meta property="og:title" content="Antony Maziero Warken — Full-Stack Developer" />
    <meta property="og:description" content="Full-Stack Developer building modern digital experiences." />
    <meta property="og:type" content="website" />
    <!-- Theme color -->
    <meta name="theme-color" content="#0f0f12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <title>Antony Maziero Warken — Full-Stack Developer</title>
    <!-- Prevent flash of wrong theme -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('portfolio-theme');
          if (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
